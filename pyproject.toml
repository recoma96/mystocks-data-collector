[project]
name = "mystocks-data-collector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "recoma", email = "seokbong60@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.63",
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "pandas>=3.0.5",
    "pandas-market-calendars>=5.4.0",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "pytz>=2026.3.post1",
    "types-boto3[essential]>=1.43.63",
    "tzdata>=2026.3",
]

[project.scripts]
exec = "mystocks_data_collector:main"
test = "pytest:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pandas-stubs>=3.0.5.260730",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
files = ["src"]

[[tool.mypy.overrides]]
module = "pandas_market_calendars.*"
ignore_missing_imports = true
