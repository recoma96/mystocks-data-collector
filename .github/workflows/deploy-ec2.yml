name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: uv 설치
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: PATH 등록
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: 의존성 설치
        run: uv sync

      - name: 테스트 실행
        run: uv run test
